version: 2

updates:
  # uv.lock（REPO-LAYOUT §5：uv.lock + actions）。若 Dependabot 在本仓库不识别
  # `uv` 生态，改回 `pip` 即可（它同样能解析 uv.lock）。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
